[package]
name = "git_torrent"
version = "0.1.0"
edition = "2021"
description = "Git descentralizado sobre Torrent/DHT em Rust (MVP)"

[dependencies]
# Criptografia (estilo Bitcoin/Tor)
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
md-5 = "0.10"          # Para validação do arquivo .binary (md5sum)
data-encoding = "2.5"  # Base32 para endereço estilo .onion
zeroize = { version = "1.8", features = ["derive"] }

# Serialização e CLI
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"

# Observabilidade
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Rede P2P / DHT (Base para Torrent/Kademlia)
# Habilitado via `cargo build --features network` (ver src/p2p.rs).
# `identify` é essencial: sem ele os nós não confirmam endereço externo e o
# kad fica em modo Client (não responde requests inbound).
libp2p = { version = "0.53", optional = true, features = ["tokio", "kad", "gossipsub", "identify", "noise", "tcp", "yamux", "macros"] }
tokio = { version = "1.37", features = ["full"] }
anyhow = "1.0"

[features]
default = []
# Transporte Kademlia real (main.rs não depende dele no MVP local).
network = ["dep:libp2p"]

[lints.rust]
warnings = "warn"

[lints.clippy]
pedantic = "warn"
nursery = "warn"
